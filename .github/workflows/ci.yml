name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected needs history to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD for `nx affected`.
      - uses: nrwl/nx-set-shas@v4

      - name: Formatting
        run: npx nx format:check

      - name: Lint, typecheck, test, build
        run: npx nx affected -t lint typecheck test build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx nx affected -t e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output
          path: |
            apps/**/test-output
            apps/web-e2e/playwright-report
          retention-days: 7

  docker:
    # Only proves the images still build; publishing is left to your registry.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: verify
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: platform-${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
