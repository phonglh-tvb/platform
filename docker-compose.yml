services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3333'
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - '3333:3333'
    healthcheck:
      # 127.0.0.1 chứ không phải localhost: trong image alpine, localhost resolve
      # ra ::1 (IPv6) trong khi Node bind 0.0.0.0 (IPv4) nên sẽ bị refuse.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3333/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3333
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
