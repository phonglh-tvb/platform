services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3333'
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - '3333:3333'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3333/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3333
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
